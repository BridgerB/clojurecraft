name: simrace

# The sim race (clojure -M:simrace, ci/simrace.edn): runners that play the whole bot, from empty
# hands at every landing of the race's captured worlds to the target, against the server model,
# on every core, seed after seed until their budget is spent: a core that ends a run starts the
# next at once (issue #127). The real-server race (race.yml) has the other lanes; a code merge
# has the fleet restart both with the merged code. Every failed run carries its signature. Every 20 minutes,
# staggered by runner, the runner reports the runs that ended since its last report (bb churn
# batch): failures to the issues, one per signature, facts to the results page as a batch; the
# snapshots it files on go to the hour's evidence release first (bb churn).

# Lanes, as race.yml: each run is one lane (the runner k of the old matrix, a share of the worlds),
# dispatched, given back and replaced by the fleet (fleet.yml, ci/fleet.edn).

on:
  workflow_dispatch:                    # by the fleet (fleet.yml), one lane a run
    inputs:
      lane:
        description: the lane, 1..8 (the runner of the old matrix)
        required: true
        default: '1'

run-name: simrace lane ${{ inputs.lane }}

permissions:
  contents: write                       # the results page's branch, gh-pages (bb page publish)
  actions: write                        # each publish dispatches pages.yml, the page's deployment
  issues: write

concurrency:
  group: simrace-lane-${{ inputs.lane }}  # one run a lane; a second waits for the first to end
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      runners: ${{ steps.read.outputs.runners }}
      count: ${{ steps.read.outputs.count }}
      sets: ${{ steps.read.outputs.sets }}
      until: ${{ steps.read.outputs.until }}
      max-minutes: ${{ steps.read.outputs.max-minutes }}
      budget: ${{ steps.read.outputs.budget }}
      heap: ${{ steps.read.outputs.heap }}
    steps:
      - uses: actions/checkout@v7
      - name: Read ci/simrace.edn
        id: read
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
          bb -e '(let [r (clojure.edn/read-string (slurp "ci/simrace.edn"))]
                   (println (str "runners=" (cheshire.core/generate-string [(parse-long "${{ inputs.lane }}")])))
                   (println (str "count=" (:simrace/runners r)))
                   (println (str "sets=" (cheshire.core/generate-string (:simrace/sets r))))
                   (println (str "until=" (:simrace/until r)))
                   (println (str "max-minutes=" (:simrace/max-minutes r)))
                   (println (str "budget=" (:simrace/budget-minutes r)))
                   (println (str "heap=" (:simrace/heap-mb r))))' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  sim:
    # the captured worlds are made once by simworld.yml (dispatch it when a set's key changes) and
    # only restored here: a miss fails the job at once
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 355              # GitHub kills a job at 360; a runner plays :simrace/budget-minutes (330)
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    steps:
      - uses: actions/checkout@v7
      # one restore a set: steps cannot loop, so every set ci/simrace.edn may name has its step
      - name: R1's captured worlds
        if: contains(fromJSON(needs.plan.outputs.sets), 'R1')
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R1
          key: simworld-R1-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
          fail-on-cache-miss: true
      - name: R2's captured worlds
        if: contains(fromJSON(needs.plan.outputs.sets), 'R2')
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R2
          key: simworld-R2-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
          fail-on-cache-miss: true
      - name: R3's captured worlds
        if: contains(fromJSON(needs.plan.outputs.sets), 'R3')
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R3
          key: simworld-R3-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
          fail-on-cache-miss: true
      - name: R4's captured worlds
        if: contains(fromJSON(needs.plan.outputs.sets), 'R4')
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R4
          key: simworld-R4-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
          fail-on-cache-miss: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI and Babashka
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn') }}
      - name: Sim race
        env:
          SETS: ${{ needs.plan.outputs.sets }}
          GH_TOKEN: ${{ github.token }}   # the churn's reports: issues, the page
          RUNNER_N: ${{ matrix.runner }}
        run: |
          worlds=$(echo "$SETS" | jq -r 'map("cache/sim-worlds/" + .) | join(",")')
          mkdir -p data/simrace
          clojure -J-Xmx${{ needs.plan.outputs.heap }}m -M:simrace --worlds "$worlds" \
            --runner ${{ matrix.runner }} --runners ${{ needs.plan.outputs.count }} \
            --until ${{ needs.plan.outputs.until }} --max-minutes ${{ needs.plan.outputs.max-minutes }} \
            --budget-minutes ${{ needs.plan.outputs.budget }} --commit "$GITHUB_SHA" --out data/simrace \
            > data/simrace/simrace.log 2>&1 &
          sim=$!
          mkdir -p work
          echo "$sim" > work/sim.pid   # for Stop the sim race, on a cancel too
          code_at=$(git show -s --format=%cI "$GITHUB_SHA")
          report() {
            bb churn batch sim data/simrace "simrace-$GITHUB_SHA-$RUNNER_N" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$code_at" "$RUNNER_N" \
              || echo "churn: the batch's report failed; its lines wait for the next"
          }
          # every 20 minutes while the sim plays, runner r's first 75 s more than 2.5 min x (r-1)
          # later than runner 1's, so its page pushes fall between the real race's
          (
            next=$(( $(date +%s) + 1200 + (RUNNER_N - 1) * 150 + 75 ))
            while kill -0 "$sim" 2>/dev/null; do
              if [ "$(date +%s)" -ge "$next" ]; then report; next=$(( $(date +%s) + 1200 )); fi
              sleep 60
            done
          ) &
          churn=$!
          wait "$sim" || true
          wait "$churn" || true
          grep -E '^SIMRACE ' data/simrace/simrace.log || tail -n 40 data/simrace/simrace.log
      - name: Stop the sim race
        # before the last report: a cancel leaves the sim race running on every core, as it leaves
        # race.yml's races (Stop the races, issue #145), and the last report's judges would get none
        # of them (sim lane 38986998175: out of time at 120 s, nothing judged). Shell builtins only
        if: always()
        run: |
          if [ -f work/sim.pid ]; then kill "$(cat work/sim.pid)" 2>/dev/null || true; fi
      - name: Last report
        # the runs that ended since the last batch; a cancel (a merge's push) runs it too, its judges
        # stopped after 120 s (GitHub kills a cancelled job about four minutes on)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bb churn batch sim data/simrace "simrace-$GITHUB_SHA-${{ matrix.runner }}" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            "$(git show -s --format=%cI "$GITHUB_SHA")" "${{ matrix.runner }}" 120 || echo "churn: the last report failed"
      - name: Summary
        if: always()
        run: |
          {
            echo "### sim runner ${{ matrix.runner }}"
            echo '```'
            grep -E '^SIMRACE ' data/simrace/simrace.log | cut -c1-2000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()              # a cancelled round's artifact too; the snapshots the issues name are in the evidence releases
        with:
          name: simrace-${{ github.sha }}-${{ matrix.runner }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/simrace/runs.edn
            data/simrace/simrace.log
            data/simrace/snapshots/
