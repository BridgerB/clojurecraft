name: pages

# The results page (bb page, issue #116) is the gh-pages branch, deployed by this workflow rather
# than GitHub's built-in branch build, whose actions are on the deprecated Node.js 20. Each batch a
# race runner publishes (bb churn, page/publish-round!) dispatches it after its push; a dispatch by
# hand deploys the branch as it is.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write                          # deploy-pages
  id-token: write                       # deploy-pages proves where the deployment comes from

concurrency:
  group: pages
  cancel-in-progress: false             # never cut a deployment short; the newest waits as the one pending run

jobs:
  deploy:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v5
