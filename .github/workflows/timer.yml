name: timer

# Keeps the runners busy without anyone watching. Every 20 minutes: count the jobs running or
# queued across the repository; when at least MIN_FREE of the 20 are free and no plan run is
# still going, dispatch the next plan in ci/plan/queue/ (by name) that has never run, or, with
# the queue spent, the soak plan with a fresh salt. One plan at a time: two soaks held nineteen
# runners for an afternoon and every push queued behind them. A plan's runs are named after it (plan.yml run-name), which is how "never run" is
# known: the timer writes nothing.

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  CAP: 20
  MIN_FREE: 4
  SOAK: ci/plan/soak.edn

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Launch the next plan when runners are free
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=0
          for status in in_progress queued; do
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=$status&per_page=100" --jq '.workflow_runs[].id'); do
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.status != "completed")] | length')
              busy=$((busy + n))
            done
          done
          busy=$((busy - 1))   # this job
          free=$((CAP - busy))
          echo "jobs running or queued elsewhere: $busy; free: $free"
          if [ "$free" -lt "$MIN_FREE" ]; then echo "fewer than $MIN_FREE runners free; nothing launched"; exit 0; fi
          running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow plan.yml --status in_progress --json databaseId --jq 'length')
          queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow plan.yml --status queued --json databaseId --jq 'length')
          if [ "$((running + queued))" -gt 0 ]; then echo "a plan is still running or queued; nothing launched"; exit 0; fi
          ran=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow plan.yml --limit 1000 --json displayTitle --jq '.[].displayTitle')
          next=""
          for p in ci/plan/queue/*.edn; do   # a glob expands sorted
            [ -f "$p" ] || continue
            if ! grep -qxF "plan $p" <<< "$ran"; then next=$p; break; fi
          done
          if [ -n "$next" ]; then
            echo "launching queued plan $next"
            gh workflow run plan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f plan="$next"
          else
            echo "queue spent; launching $SOAK with salt $GITHUB_RUN_ID"
            gh workflow run plan.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f plan="$SOAK" -f salt="$GITHUB_RUN_ID"
          fi
          echo "launched: ${next:-$SOAK} (free $free)" >> "$GITHUB_STEP_SUMMARY"
