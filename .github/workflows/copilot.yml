name: copilot

# The orchestrator: one runner that keeps Copilot cloud agent on the bot-failure issues until each
# closes. It runs bb copilot dispatch (bb/clojurecraft/copilot.clj) once a minute for most of a
# job's six hours: an unassigned issue goes to Copilot's bot-fixer agent
# (.github/agents/bot-fixer.agent.md) while fewer than COPILOT_CAP (default 1: one fix at a time,
# no conflicts between fixes) are held; runs held for approval are released, an ended session's
# draft is marked ready, a green pull request is merged (its Fixes line closes the issue), a red one
# gets a continue comment, a session that never started is retried. The hourly schedule is its
# watchdog: while a loop runs, the next run waits behind it in the concurrency group and starts
# the moment it ends, so one loop is always running and never two. A dispatch with dry-run makes
# one pass that only prints. Each pass first moves to the newest main, so a merged change to the
# dispatcher reaches the loop within a minute (this file itself takes effect at the next restart).
#
# GitHub assigns Copilot and hears @copilot only from a user, so it needs the secret COPILOT_TOKEN
# in the environment copilot-dispatch (deployment branches: main only, so no other branch's
# workflow can read it): a fine-grained token on this repository with read and write on actions,
# contents, issues and pull requests. The dispatcher never merges a change to the workflows or
# itself (copilot/guarded), the one way a session's code could reach the token. Without the secret
# the job says so and stops. To stop the orchestrator: set the variable COPILOT_DISPATCH=false and
# cancel the running loop.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: one pass that only prints the moves
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: copilot-dispatch
  cancel-in-progress: false

jobs:
  orchestrate:
    if: vars.COPILOT_DISPATCH != 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 355
    environment: copilot-dispatch    # COPILOT_TOKEN lives here, readable only from main
    steps:
      - uses: actions/checkout@v7
      - name: Install Babashka
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
      - name: Dispatch once a minute
        env:
          GH_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          COPILOT_CAP: ${{ vars.COPILOT_CAP }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::no COPILOT_TOKEN secret: nothing dispatched (see the comment at the top of copilot.yml)"
            exit 0
          fi
          if [ "$DRY_RUN" = true ]; then bb copilot dispatch --dry-run; exit 0; fi
          end=$(( $(date +%s) + 345 * 60 ))      # the job's six hours less a margin; the watchdog run takes over
          while [ "$(date +%s)" -lt "$end" ]; do
            echo "== $(date -u +%H:%M:%SZ)"
            git fetch -q origin main && git reset -q --hard origin/main   # each pass runs the newest main: a merged change reaches the loop within a minute
            timeout 240 bb copilot dispatch || echo "dispatch failed or hung past 240 s; the next pass tries again"   # a hung gh call froze the loop for an hour (2026-10-17)
            sleep 60
          done
