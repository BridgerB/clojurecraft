name: test

# The suite on every push, minutes not hours, three jobs, so it fits the four runners the rounds
# leave free: one job runs every test but the forest property, all namespaces and vars in parallel
# on the runner's cores (unit.yml: clojurecraft.runner, eftest), about four minutes; one more runs
# 250 generated forests with a fresh seed; actionlint. A dispatch runs all eight forest shards
# (the 2,000). The serial suite on one runner took nine minutes, most of it the sim namespace.

on:
  push:
    branches-ignore: [race-capacity, "fix/**", gh-pages]   # race-capacity is the capacity experiment (capacity.yml); a fix branch runs unit.yml through issue.yml; gh-pages is the results page's data
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    uses: ./.github/workflows/unit.yml   # one definition, shared with issue.yml

  forests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[1, 2, 3, 4, 5, 6, 7, 8]' || '[1]') }}
    env:
      FOREST_TRIALS: '250'
      FOREST_SEED: ${{ github.run_id }}${{ matrix.shard }}   # a fresh seed every push, printed on failure so it replays
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
      - name: 250 generated forests
        run: clojure -M:test -v clojurecraft.sim-test/the-wood-goal-holds-in-generated-forests

  workflows:
    # A workflow GitHub cannot parse runs no jobs and says little; lint every one on push.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -shellcheck= -color
