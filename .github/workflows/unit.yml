name: unit

# Every test but the forest property, all namespaces and vars in parallel on one runner's cores
# (clojurecraft.runner, eftest), the Babashka tooling's own tests, then the static checks: bb
# test, bb test:bb and bb check, what bb ci runs on a Mac. One definition, called by test.yml on every push and by issue.yml on a fix/<issue>-* pull
# request, so a fix that breaks an older assertion is seen before main is (issue #98: the bank
# test asserted the mechanism #75 replaced, and main's suite was red after the merge).

on:
  workflow_call:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 25             # the suite takes about 5 min and bb check about 4; a loaded runner doubles both
    env:
      FOREST_TRIALS: '0'               # test.yml's forests jobs run them
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI
        run: |
          for i in 1 2 3 4 5 6; do curl -fsSL https://download.clojure.org/install/linux-install-1.12.6.1673.sh -o /tmp/clj.sh && sed -i "s#https://github.com/clojure/brew-install/releases/download/1.12.6.1673/#https://download.clojure.org/install/#" /tmp/clj.sh && sudo bash /tmp/clj.sh && break; [ "$i" = 6 ] && exit 1; sleep $((i * 15)); done
      - name: Install Babashka (the flake's version, as bb.edn's :min-bb-version)
        run: |
          for i in 1 2 3 4 5 6; do curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh && sudo bash /tmp/bb.sh --version 1.13.225 && break; [ "$i" = 6 ] && exit 1; sleep $((i * 15)); done
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn') }}
      # bb ci, in two steps so a red one says which half failed; the same tasks as on a Mac
      - name: Unit, property and simulation tests (bb test)
        run: bb test
      - name: The Babashka tooling's tests (bb test:bb - the results' writers and the site)
        run: bb test:bb
      - name: Static checks (bb check - format, lint, idioms, ns forms, unused vars, brain)
        run: bb check
