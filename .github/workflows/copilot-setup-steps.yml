name: copilot-setup-steps

# The machine a Copilot cloud agent session works on (.github/agents/bot-fixer.agent.md): set up
# before the session starts, while the network is still open. Java 25, the Clojure CLI and
# Babashka as unit.yml has them; every alias the tests and bb check use, downloaded; the four
# captured sim worlds a snapshot is played in, as probe.yml restores them; and the snapshots of
# every open sim bot-failure issue (bb issue-check fetch: from the evidence releases its comments
# name, or an older comment's artifact) moved to cache/issues/<n>/, outside the
# tree, so the session copies only its own issue's into test/issues/<n>/. Last, the brief for the
# issue Copilot holds (bb brief write, bb/clojurecraft/brief.clj): its snapshots judged on main
# and on the session's branch, where its reason is raised, the stage's rows, the issue and the
# closed issues with the same reason, in cache/issues/<n>/brief.md, so the model spends no turns
# (each re-sends everything read so far) on what a script finds. The job must be named
# copilot-setup-steps; a push or pull request that changes this file runs it as a check.

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read
  actions: read                         # an older comment's snapshot artifact (newer ones are release assets)
  issues: read                          # which bot-failure issues are open, and their comments
  pull-requests: read                   # the brief: the pull requests that closed an issue with the same reason

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59                 # the whole Copilot session, setup included (59 is the most it allows; 30 cut the first one off)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                # main's history, to bring an old branch up to date
      - name: The session's branch up to date with main
        run: |
          # a follow-up works an older Copilot branch: without main's newest tooling it has no
          # bb verify, an old brief and an old profile (#403 ran bb ci, the forest included, for 50
          # minutes and was cut before it pushed). A conflict is left for the session to resolve.
          branch=$(git rev-parse --abbrev-ref HEAD)
          case "$branch" in copilot/*) ;; *) echo "not a Copilot branch: $branch"; exit 0;; esac
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main HEAD; then echo "$branch has main"; exit 0; fi
          if git -c user.name=copilot-setup -c user.email=copilot-setup@users.noreply.github.com merge --no-edit -q origin/main; then
            echo "merged origin/main into $branch"
          else
            git merge --abort
            echo "$branch conflicts with main: the session merges it and resolves the conflicts"
          fi
      - name: R1's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R1
          key: simworld-R1-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R2's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R2
          key: simworld-R2-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R3's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R3
          key: simworld-R3-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R4's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R4
          key: simworld-R4-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R1's captured Nether
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-nether/R1.edn.gz
          key: simnether-R1-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture_nether.clj') }}
          fail-on-cache-miss: false
      - name: R2's captured Nether
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-nether/R2.edn.gz
          key: simnether-R2-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture_nether.clj') }}
          fail-on-cache-miss: false
      - name: R3's captured Nether
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-nether/R3.edn.gz
          key: simnether-R3-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture_nether.clj') }}
          fail-on-cache-miss: false
      - name: R4's captured Nether
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-nether/R4.edn.gz
          key: simnether-R4-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture_nether.clj') }}
          fail-on-cache-miss: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI and Babashka
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn') }}
      - name: Every alias the session runs, downloaded
        run: |
          clojure -P -M:dev:test
          clojure -P -M:simrace
          for a in fmt lint splint lsp brain; do clojure -P -M:$a; done
          bb tasks > /dev/null
      - name: The snapshots of every open sim bot-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label bot-failure --label sim --state open --limit 100 --json number --jq '.[].number'); do
            out=$(bb issue-check fetch "$n" 2>&1) || echo "issue $n: fetch failed"
            echo "$out"
            # every file the fetch names, tracked or not: a snapshot an earlier fix committed under
            # the same name was overwritten, never untracked, and the brief said no evidence (#342)
            for f in $(echo "$out" | sed -n 's/^fetched //p'); do
              mkdir -p "cache/issues/$n"
              cp "$f" "cache/issues/$n/"
            done
            git checkout -q -- "test/issues/$n" 2>/dev/null || true
            git clean -qfd -- "test/issues/$n"
          done
          ls -R cache/issues 2>/dev/null || echo "no snapshots fetched"
      - name: The brief for the issue Copilot holds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 900 bb brief write || echo "no brief written; the session finds these itself"
