name: capacity

# How many racing bots a runner carries, and how to split its memory (bb capacity, ci/capacity.edn).
# Every runner races from spawn to the nether on its own server and seed while bots join in steps
# (ten, then ten more every five minutes); the race's sampler and the machine's sampler record
# every fifteen seconds; the report job reads every runner's samples, finds the most bots each
# carried healthy and fits each JVM's memory per bot, and posts the sizing on the pull request.

on:
  push:
    branches: [race-capacity]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      runners: ${{ steps.read.outputs.runners }}
      server-heap: ${{ steps.read.outputs.server-heap }}
      bot-heap: ${{ steps.read.outputs.bot-heap }}
      max-players: ${{ steps.read.outputs.max-players }}
    steps:
      - uses: actions/checkout@v7
      - name: Read ci/capacity.edn
        id: read
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
          bb -e '(let [r (clojure.edn/read-string (slurp "ci/capacity.edn"))]
                   (println (str "runners=" (cheshire.core/generate-string (vec (range 1 (inc (:race/runners r)))))))
                   (println (str "server-heap=" (:race/server-heap-mb r)))
                   (println (str "bot-heap=" (:race/bot-heap-mb r)))
                   (println (str "max-players=" (:race/max-players r))))' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  ramp:
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    env:
      PORT: '25565'
      RCON_PORT: '25575'
      RCON_PASS: capacity
      WORLD: ${{ github.workspace }}/work/world
      HEAP_MB: ${{ needs.plan.outputs.server-heap }}
      DIFFICULTY: normal
      MAX_TICK_TIME: '-1'
      MAX_PLAYERS: ${{ needs.plan.outputs.max-players }}
      COMPRESSION_THRESHOLD: '-1'        # as the race: bots on the same machine, zlib would be only CPU
      SYNC_CHUNK_WRITES: 'false'
      LEVEL_SEED: capacity-${{ github.run_id }}-${{ matrix.runner }}
      # Runners 1 and 2 record a flight recording of each JVM for the whole ramp (what the server's
      # tick and the bots spend their CPU on, at every load); the others measure undisturbed.
      PROFILE: ${{ matrix.runner <= 2 && 'true' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI and Babashka
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn') }}
      - uses: actions/cache@v6
        with:
          path: data/local-server/server-26.1.2.jar
          key: server-26.1.2
      - name: Server
        run: |
          clojure -P -M:race
          mkdir -p data/race
          if [ -n "$PROFILE" ]; then
            export SERVER_JAVA_OPTS="-XX:StartFlightRecording=name=cap,filename=$PWD/data/race/server.jfr,dumponexit=true,maxsize=400m"
          fi
          bb server start
      - name: Ramp
        run: |
          bb capacity sample data/race/sys.edn ${{ matrix.runner }} > data/race/sampler.log 2>&1 &
          sleep 20   # preflight: a sampler that wrote nothing fails the job now, readable, not after the ramp
          if [ ! -s data/race/sys.edn ]; then echo "::error::the machine sampler wrote nothing"; cat data/race/sampler.log; exit 1; fi
          head -c 600 data/race/sys.edn
          JFR=""
          if [ -n "$PROFILE" ]; then JFR="-J-XX:StartFlightRecording=name=cap,filename=$PWD/data/race/bots.jfr,dumponexit=true,maxsize=400m"; fi
          clojure -J-Xmx${{ needs.plan.outputs.bot-heap }}m $JFR -M:race --config ci/capacity.edn --port "$PORT" \
            --rcon-port "$RCON_PORT" --rcon-pass "$RCON_PASS" --record-dir data/race \
            --commit "$GITHUB_SHA" --seed "$LEVEL_SEED" --runner ${{ matrix.runner }} > data/race/race.log 2>&1 || true
          grep -E '^(RACE|SAMPLE)' data/race/race.log | tail -n 3 || true
      - name: Dump the server's flight recording
        if: ${{ !cancelled() && env.PROFILE == 'true' }}
        run: |
          jcmd "$(cat "$WORLD/server.pid")" JFR.dump name=cap filename="$PWD/data/race/server.jfr" || true
          ls -la data/race/*.jfr || true
      - name: Stop the server
        if: always()
        run: bb server stop || true
      - name: Keep the measurements
        if: ${{ !cancelled() }}
        run: cp "$WORLD/server.log" data/race/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: capacity-${{ matrix.runner }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/race/samples.edn
            data/race/sys.edn
            data/race/milestones.edn
            data/race/summary.edn
            data/race/race.log
            data/race/server.log
            data/race/sampler.log
            data/race/*.jfr

  report:
    needs: ramp
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: capacity-*
          path: runs
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
          bb capacity report runs "### Capacity ${{ github.run_id }} at ${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v7
        with:
          name: capacity-report
          path: capacity.edn
