name: race

# The race (issue #17): every runner the repo has, each with ci/race.edn's servers on one of the
# race's pregenerated landing sets (the same worlds and landings every commit), each server
# carrying ci/race.edn's bots from landings of their own to the target (clojure -M:race). A code
# merge has the fleet cancel and replace the lanes: the races always run what is merged, and
# there is no second branch to keep in step.
# Each server stays full the whole job (issue #127): a bot that ends is replaced at once by a
# fresh one, no bot waits for another, and a bot still playing when the job ends is cut, never
# filed. The board (BOARD lines in the Race step's log) shows the bots playing each minute. Every
# 20 minutes, staggered by runner, the runner reports the bots that ended since its last report
# (bb churn batch): their failures to the issues, their facts to the results page on gh-pages as
# a batch of this run (bb page), a win as a release. Nothing waits for the slowest runner. The
# snapshots a batch files on go to the hour's evidence release (evidence-<day>-<hour>) before its
# comments name them: a cancel, or the artifact's 7 days, never takes an issue's evidence.

# Lanes (fleet.yml, ci/fleet.edn): each run is one lane, the runner k of the old matrix, one job's
# worth (GitHub caps a job at 6 h). The fleet dispatches lanes into free runners, cancels the newest
# when another workflow's job waits for a runner (GitHub has no preemption of its own), and cancels
# and replaces lanes whose code main has replaced. A cancelled lane still stops its races, reports
# and uploads (the always() steps). The repository variable RACE_CONTINUOUS=false stops new lanes.

on:
  workflow_dispatch:                    # by the fleet (fleet.yml), one lane a run
    inputs:
      lane:
        description: the lane, 1..8 (the runner of the old matrix)
        required: true
        default: '1'
      from:
        description: "where the bots start, spawn or fortress; empty keeps ci/race.edn's :race/from"
        required: false
        default: ''

run-name: race lane ${{ inputs.lane }}

permissions:
  contents: write                       # the results page's branch, gh-pages (bb page publish)
  actions: write                        # each publish dispatches pages.yml, the page's deployment
  issues: write                         # the failures' issues

concurrency:
  group: race-lane-${{ inputs.lane }}  # one run a lane; a second waits for the first to end
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      runners: ${{ steps.read.outputs.runners }}
      servers: ${{ steps.read.outputs.servers }}
      sets: ${{ steps.read.outputs.sets }}
      bots: ${{ steps.read.outputs.bots }}
      server-heap: ${{ steps.read.outputs.server-heap }}
      bot-heap: ${{ steps.read.outputs.bot-heap }}
    steps:
      - uses: actions/checkout@v7
      - name: Read ci/race.edn
        id: read
        run: |
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
          bb -e '(let [r (clojure.edn/read-string (slurp "ci/race.edn"))]
                   (println (str "runners=" (cheshire.core/generate-string [(parse-long "${{ inputs.lane }}")])))
                   (println (str "servers=" (:race/servers r 1)))
                   (println (str "sets=" (cheshire.core/generate-string (:race/landing-sets r))))
                   (println (str "bots=" (:race/bots r)))
                   (println (str "server-heap=" (:race/server-heap-mb r)))
                   (println (str "bot-heap=" (:race/bot-heap-mb r))))' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  race:
    # the landing sets' worlds are built once by world.yml (dispatch it when a set's key changes)
    # and only restored here: a miss fails the job at once
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 355              # GitHub kills a job at 360; the slots stop starting bots near :race/run-minutes (330)
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    # A runner races on one landing set (:race/landing-sets, runner r on set (r-1) mod the sets),
    # a pregenerated world restored from the cache, and carries :race/servers servers, each its
    # own copy of that world, ports (game 25565+k-1, RCON 25575+k-1), race process and record
    # directory (data/race/s<k>): a vanilla server ticks on one thread, so one server stops at the
    # bots that thread can carry, and more servers use the runner's other cores. Each server's bots
    # start at their own offset into the set's landings, so the runners sharing a set and the
    # servers sharing a runner land their bots on different landings, the same ones every commit.
    env:
      SERVERS: ${{ needs.plan.outputs.servers }}
      BOTS: ${{ needs.plan.outputs.bots }}
      RCON_PASS: race
      HEAP_MB: ${{ needs.plan.outputs.server-heap }}
      DIFFICULTY: normal
      MAX_TICK_TIME: '-1'                # no watchdog: a slow locate biome stalls the race, it does not end it
      MAX_PLAYERS: '80'                  # vanilla seats 20; the race seats its bots with room to reconnect
      COMPRESSION_THRESHOLD: '-1'        # bots on the same machine: zlib would be only CPU, both ends
      SYNC_CHUNK_WRITES: 'false'         # a thrown-away world: no synchronous write per saved chunk
    steps:
      - uses: actions/checkout@v7
      - name: Which landing set
        id: set
        env:
          SETS: ${{ needs.plan.outputs.sets }}
        run: |
          n=$(echo "$SETS" | jq length)
          r=${{ matrix.runner }}
          echo "set=$(echo "$SETS" | jq -r ".[$(( (r - 1) % n ))]")" >> "$GITHUB_OUTPUT"
          before=$(( (r - 1) / n ))   # runners on this set before this one (integer division)
          echo "first=$(( before * SERVERS * BOTS ))" >> "$GITHUB_OUTPUT"   # this runner's first landing
          cat "$GITHUB_OUTPUT"
      - name: The pregenerated world (never built here)
        uses: actions/cache/restore@v6
        with:
          path: cache/worlds/${{ steps.set.outputs.set }}
          # world.yml's key, the same expression: a matrix of world.yml calls returns no key per set
          key: world-${{ steps.set.outputs.set }}-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj') }}
          fail-on-cache-miss: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI and Babashka
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn') }}
      - uses: actions/cache@v6
        with:
          path: data/local-server/server-26.1.2.jar
          key: server-26.1.2
      - name: Servers
        run: |
          clojure -P -M:race
          mkdir -p work
          for k in $(seq 1 "$SERVERS"); do
            echo "server $k: set ${{ steps.set.outputs.set }}, $BOTS bots from landing $(( ${{ steps.set.outputs.first }} + (k - 1) * BOTS ))"
            cp -r "cache/worlds/${{ steps.set.outputs.set }}" "work/world-$k"   # the seed is the set's own, in its level.dat
            PORT=$((25564 + k)) RCON_PORT=$((25574 + k)) WORLD="$PWD/work/world-$k" bb server start
          done
      - name: Race
        env:
          GH_TOKEN: ${{ github.token }}   # the churn's reports: issues, the page, releases
          RUNNER_N: ${{ matrix.runner }}
          FROM: ${{ inputs.from }}        # '' keeps ci/race.edn's :race/from
        run: |
          races=""
          for k in $(seq 1 "$SERVERS"); do mkdir -p "data/race/s$k"; touch "data/race/s$k/race.log"; done
          tail -n +1 -F data/race/s*/race.log 2>/dev/null | grep --line-buffered -E '^(BOARD|MILESTONE|RACE) ' &
          for k in $(seq 1 "$SERVERS"); do
            dir="data/race/s$k"
            server=""
            if [ "$SERVERS" -gt 1 ]; then server="--server $k"; fi
            from=""
            if [ -n "$FROM" ]; then from="--from $FROM"; fi
            # shellcheck disable=SC2086 # $server and $from are two words or none
            clojure -J-Xmx${{ needs.plan.outputs.bot-heap }}m -M:race --config ci/race.edn --port $((25564 + k)) \
              --rcon-port $((25574 + k)) --rcon-pass "$RCON_PASS" --record-dir "$dir" --commit "$GITHUB_SHA" \
              --seed "${{ steps.set.outputs.set }}" --runner ${{ matrix.runner }} $server $from \
              --landings "cache/worlds/${{ steps.set.outputs.set }}/landings.edn" \
              --landing-offset $(( ${{ steps.set.outputs.first }} + (k - 1) * BOTS )) \
              > "$dir/race.log" 2>&1 &
            races="$races $!"
          done
          code_at=$(git show -s --format=%cI "$GITHUB_SHA")
          report() {
            bb churn batch real data/race "race-$GITHUB_SHA-$RUNNER_N" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$code_at" "$RUNNER_N" \
              || echo "churn: the batch's report failed; its lines wait for the next"
          }
          playing() { for p in $races; do kill -0 "$p" 2>/dev/null && return 0; done; return 1; }
          # every 20 minutes while the races play, runner r's first 2.5 min x (r-1) later than runner 1's
          (
            next=$(( $(date +%s) + 1200 + (RUNNER_N - 1) * 150 ))
            while playing; do
              if [ "$(date +%s)" -ge "$next" ]; then report; next=$(( $(date +%s) + 1200 )); fi
              sleep 60
            done
          ) &
          churn=$!
          # shellcheck disable=SC2086 # one pid per word
          printf '%s\n' $races > work/races.pids   # for Stop the races, on a cancel too
          # the machine's load every 5 minutes (issue #140): processes, threads, the cgroup's pid
          # limit, memory and the biggest thread holders, so a runner that runs out of threads is seen
          load() {
            echo "LOAD $(date -u +%FT%TZ) procs $(ps -e --no-headers | wc -l) threads $(ps -eLf --no-headers | wc -l)" \
              "pids $(cat /sys/fs/cgroup/pids.current 2>/dev/null)/$(cat /sys/fs/cgroup/pids.max 2>/dev/null)" \
              "ulimit-u $(ulimit -u) mem-mb $(free -m | awk '/Mem:/ {print $3 "/" $2}')" \
              "top $(ps -eo nlwp,comm --no-headers --sort=-nlwp | head -n 4 | tr -s ' ' | tr '\n' ',')"
          }
          load
          ( while playing; do sleep 300; load; done ) &
          # a server that dies is started again on its world, up to 3 times (race 39817745908:
          # server 2 crashed 25 s in on a vanilla NPE generating a chunk, MoonPhase null in
          # ServerLevel.getMoonBrightness, and its slots spent three hours on bots that could not
          # connect). Its race's slots stop starting bots once 5 in a row never got into play and
          # start again when it accepts (race.clj, health). Each dead server's log is kept as
          # server-died-<n>.log beside its race.log; its crash reports go in the artifact (Pack)
          watch_servers() {
            for k in $(seq 1 "$SERVERS"); do
              w="work/world-$k"
              pid=$(cat "$w/server.pid" 2>/dev/null || true)
              if [ -z "$pid" ] || kill -0 "$pid" 2>/dev/null; then continue; fi
              n=$(( $(find "data/race/s$k" -maxdepth 1 -name 'server-died-*.log' | wc -l) + 1 ))
              cp "$w/server.log" "data/race/s$k/server-died-$n.log" 2>/dev/null || true
              if [ "$n" -gt 3 ]; then
                echo "SERVER $k DIED again $(date -u +%FT%TZ), after 3 restarts: left down"
                rm -f "$w/server.pid"
                continue
              fi
              echo "SERVER $k DIED $(date -u +%FT%TZ): its log's last lines, then restart $n of 3"
              tail -n 15 "$w/server.log" || true
              PORT=$((25564 + k)) RCON_PORT=$((25574 + k)) WORLD="$PWD/$w" bb server start \
                || echo "SERVER $k did not come back"
            done
          }
          ( while playing; do sleep 60; watch_servers; done ) &
          # shellcheck disable=SC2086 # one pid per word
          wait $races || true   # the races alone: the tail above never ends on its own. Bots
                                # failing is what the issues are for; the step is red only when
                                # the race itself could not run
          wait "$churn" || true
      - name: Stop the races
        # before the servers stop: a cancel leaves the race processes running, and with their server
        # gone every slot would start bot after bot until the runner can fork no more (issue #145).
        # Shell builtins only, so it runs on a loaded machine
        if: always()
        run: |
          if [ -f work/races.pids ]; then
            while read -r p; do kill "$p" 2>/dev/null || true; done < work/races.pids
          fi
      - name: Last report
        # the bots that ended since the last batch, the cut ones among them; a cancel (a merge's push)
        # runs it too, so nothing a round played is lost to the next round. Its conversions stop
        # after 120 s: GitHub kills a cancelled job about four minutes on (race 38962622402 lost
        # its artifact so), and the snapshots it files go to the evidence release at once (bb churn)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bb churn batch real data/race "race-$GITHUB_SHA-${{ matrix.runner }}" "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            "$(git show -s --format=%cI "$GITHUB_SHA")" "${{ matrix.runner }}" 120 || echo "churn: the last report failed"
      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in $(seq 1 "$SERVERS"); do
            log="data/race/s$k/race.log"
            {
              echo "### runner ${{ matrix.runner }}, server $k, landing set ${{ steps.set.outputs.set }}"
              echo '```'
              grep -E '^RACE ' "$log" | cut -c1-2000 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Stop the servers
        if: always()
        run: |
          for k in $(seq 1 "$SERVERS"); do WORLD="$PWD/work/world-$k" bb server stop || true; done
      - name: Pack
        if: always()              # a cancelled round's recordings too, when the job lives long enough
        run: |
          for f in data/race/s*/*.edn; do [ -f "$f" ] && [ "$(basename "$f")" != summary.edn ] && zstd -q -3 -T0 --rm "$f"; done
          for k in $(seq 1 "$SERVERS"); do cp "work/world-$k/server.log" "data/race/s$k/server.log" 2>/dev/null || true; done
          for k in $(seq 1 "$SERVERS"); do cp -r "work/world-$k/crash-reports" "data/race/s$k/" 2>/dev/null || true; done
      - uses: actions/upload-artifact@v7
        if: always()              # a cancelled round's artifact too; the snapshots the issues name are in the evidence releases
        with:
          name: race-${{ github.sha }}-${{ matrix.runner }}
          retention-days: 7
          if-no-files-found: ignore
          path: data/race/
