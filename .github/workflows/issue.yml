name: issue

# A fix's one check (issue #77): a pull request from fix/<issue>-<what> carries the issue's failing
# moments as snapshots under test/issues/<issue>/ (bb issue-check fetch), and issues-test plays
# each on against the model for two simulated minutes; the check passes when none fails again
# with the issue's signature. Seconds of test over the race's captured worlds, restored from the
# cache; nothing is run from spawn. Beside it, unit.yml: every test but the forest property and
# the static checks, so a fix that breaks an older assertion is seen here, not on main (#98).
# test, gym and full skip fix branches: these two are the checks a fix gets.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read                          # the labels of the issues the request says it fixes

concurrency:
  group: issue-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: startsWith(github.head_ref, 'fix/')
    uses: ./.github/workflows/unit.yml

  check:
    if: startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Which issues, and a moment for each
        env:
          HEAD_REF: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(echo "$HEAD_REF" | sed -E 's|^fix/([0-9]+).*|\1|')
          case "$n" in ''|*[!0-9]*) echo "::error::branch $HEAD_REF names no issue number"; exit 1;; esac
          echo "issue $n"
          # the check is only as good as its moments (issue #116): every issue the request says it
          # fixes and that has a sim reproduction (label sim) must carry a snapshot under
          # test/issues/<n>/, else the check would pass with nothing to play; a real-only issue
          # has no sim moment to carry and is only warned about
          red=0
          for m in $(printf '%s\n' "$BODY" | grep -oiE '(fixes|closes|resolves) #[0-9]+' | grep -oE '[0-9]+' | sort -un); do
            labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$m" --jq '[.labels[].name] | join(",")' 2>/dev/null || echo '')
            if ls "test/issues/$m"/*.edn.gz >/dev/null 2>&1; then
              echo "issue $m: $(ls test/issues/$m/*.edn.gz | wc -l | tr -d ' ') snapshots"
            elif echo ",$labels," | grep -q ',sim,'; then
              echo "::error::issue $m is reproduced in the sim (label sim) but test/issues/$m holds no snapshot: bb issue-check fetch $m, or do not say Fixes"
              red=1
            else
              echo "::warning::issue $m has no sim reproduction and no snapshot: it closes on the real recordings' word alone"
            fi
          done
          [ "$red" = 0 ]
      # the race's captured worlds (simworld.yml), the key simrace.yml restores
      - name: R1's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R1
          key: simworld-R1-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R2's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R2
          key: simworld-R2-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R3's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R3
          key: simworld-R3-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - name: R4's captured worlds
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/R4
          key: simworld-R4-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ hashFiles('deps.edn') }}
      - name: Play the issue's moments on
        run: |
          set -o pipefail
          clojure -M:test -n clojurecraft.issues-test 2>&1 | tee issues.txt
          { echo '### issue check'; echo '```'; grep -E 'issues-test|recurs|skipped|Ran|assertions' issues.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
