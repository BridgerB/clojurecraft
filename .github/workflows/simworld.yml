name: simworld

# Captures a race landing set's worlds for the server model, once, and caches them (clojure
# -M:capture): a real server on the set's pregenerated world (world.yml's cache, never built
# here), a client toured round each landing, the server's own chunk columns saved one world file
# a landing. simrace.yml restores them; the model plays thousands of runs in them a runner.
#
# A cache is read by its own branch, main and a pull request's base, and is evicted after seven
# idle days (the daily races keep it warm). A dispatch with export: true also uploads the set as
# an artifact (three days), so a Mac replays the very bytes the runners play: a capture taken
# locally was not theirs (issue #74's run did not reproduce in one), and a sim run is a function
# of world, seed and code. gh run download <run> -n simworld-R3 -D cache/sim-worlds/R3

on:
  workflow_call:
    inputs:
      set:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      set:
        default: R1
      export:
        description: Also upload the set as an artifact, for a replay on a Mac of the very bytes the runners play
        type: boolean
        default: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SET: ${{ inputs.set }}
    steps:
      - uses: actions/checkout@v7
      - id: have
        name: The captured worlds (found, or taken here)
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/${{ env.SET }}
          # the key simrace.yml restores: the server world's files and the capture's own
          key: simworld-${{ env.SET }}-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
          lookup-only: true
      - name: The set's server world (world.yml built it)
        if: steps.have.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: cache/worlds/${{ env.SET }}
          key: world-${{ env.SET }}-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj') }}
          fail-on-cache-miss: true
      - uses: actions/setup-java@v6
        if: steps.have.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the Clojure CLI and Babashka
        if: steps.have.outputs.cache-hit != 'true'
        run: |
          curl -fsSL https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh -o /tmp/clj.sh
          sudo bash /tmp/clj.sh
          curl -fsSL https://raw.githubusercontent.com/babashka/babashka/master/install -o /tmp/bb.sh
          sudo bash /tmp/bb.sh --version 1.13.225
      - uses: actions/cache@v6
        if: steps.have.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ hashFiles('deps.edn') }}
      - uses: actions/cache@v6
        if: steps.have.outputs.cache-hit != 'true'
        with:
          path: data/local-server/server-26.1.2.jar
          key: server-jar-97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51
      - name: Capture
        if: steps.have.outputs.cache-hit != 'true'
        run: |
          RCON_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$RCON_PASS"
          mkdir -p work
          cp -r "cache/worlds/$SET" work/world
          clojure -P -M:capture
          PORT=25565 RCON_PORT=25575 RCON_PASS=$RCON_PASS WORLD=$PWD/work/world HEAP_MB=6144 \
            COMPRESSION_THRESHOLD=-1 MAX_TICK_TIME=-1 bb server start
          clojure -M:capture --port 25565 --rcon-port 25575 --rcon-pass "$RCON_PASS" \
            --landings "cache/worlds/$SET/landings.edn" --set "$SET" --out "cache/sim-worlds/$SET"
          WORLD=$PWD/work/world bb server stop || true
          find "cache/sim-worlds/$SET" -name '*.edn.gz' | wc -l
          du -sh "cache/sim-worlds/$SET"
      - uses: actions/cache/save@v6
        if: steps.have.outputs.cache-hit != 'true'
        with:
          path: cache/sim-worlds/${{ env.SET }}
          key: simworld-${{ env.SET }}-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
      # the lookup above restored nothing, so a found set is restored once more for the export
      - name: The set, for the export
        if: inputs.export == true && steps.have.outputs.cache-hit == 'true'
        uses: actions/cache/restore@v6
        with:
          path: cache/sim-worlds/${{ env.SET }}
          key: simworld-${{ env.SET }}-${{ hashFiles('ci/gym.edn', 'bb/clojurecraft/server.clj', 'bb/clojurecraft/worlds.clj', 'src/clojurecraft/landings.clj', 'src/clojurecraft/fixture.clj', 'src/clojurecraft/capture.clj') }}
          fail-on-cache-miss: true
      - name: Export
        if: inputs.export == true
        uses: actions/upload-artifact@v4
        with:
          name: simworld-${{ env.SET }}
          path: cache/sim-worlds/${{ env.SET }}
          compression-level: 0            # the files are gzip already
          retention-days: 3
      - name: Summary
        run: |
          echo "### sim worlds $SET: found in the cache: ${{ steps.have.outputs.cache-hit || 'false' }}; exported: ${{ inputs.export || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
