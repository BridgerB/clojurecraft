<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>clojurecraft viewer</title>
<!-- The page of clojurecraft.viewer. The world is drawn by steve's renderer (web/viewer.js and
     web/worker.js, vendored by dev/viewer/build.ts; Babylon from a CDN): /assets.json once (the
     game's models, blockstates and textures, read from the local client jar), then each column
     from /column when its version in /frame moves. The panel shows what the bot is thinking. -->
<style>
  :root { --bg:#14171a; --panel:rgba(22,25,29,.86); --fg:#dde3e8; --dim:#8c99a6; --line:#2e353c;
          --goal:#ffd54a; --act:#6bb8ff; --sub:#8dd88d; --intr:#ff6a5a; --wait:#f0a050; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.35 system-ui,sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; width:100%; height:100%; display:block; outline:none; }
  #panel { position:fixed; top:10px; right:10px; width:340px; max-height:calc(100% - 20px); overflow:auto; overflow-x:hidden;
           background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  #panel h2 { margin:10px 0 4px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); }
  .head { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .head b { font-size:15px; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); }
  .bars { display:flex; gap:10px; margin:6px 0 2px; }
  .bar { flex:1; height:8px; background:#2a2f35; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; }
  .lvl { padding:6px 9px; border-radius:5px; background:#232830; border-left:5px solid #567; margin:4px 0; }
  .lvl small { display:block; color:var(--dim); font-size:11px; }
  .lvl.goal { border-color:var(--goal); } .lvl.intr { border-color:var(--intr); background:#33201f; }
  .lvl.act { border-color:var(--act); } .lvl.sub { border-color:var(--sub); margin-left:14px; }
  .lvl.wait { border-color:var(--wait); }
  .flow { display:flex; flex-wrap:wrap; gap:3px; }
  .node { padding:2px 7px; border-radius:10px; background:#232830; border:1px solid #3a424a; font-size:11px; }
  .node.done { background:#1f4228; border-color:#3c7; } .node.cur { background:#5a4a10; border-color:var(--goal); font-weight:700; }
  .node.hot { background:#5a1e1e; border-color:var(--intr); font-weight:700; }
  .hot9 { display:grid; grid-template-columns:repeat(9,1fr); gap:3px; }
  .slot { min-width:0; overflow:hidden; aspect-ratio:1; background:#2a2f35; border:2px solid #3a424a; border-radius:4px; position:relative; }
  .slot.sel { border-color:var(--goal); }
  .slot img { width:100%; height:100%; image-rendering:pixelated; object-fit:cover; object-position:top; }
  .slot span { position:absolute; right:2px; bottom:0; font-size:11px; font-weight:700; text-shadow:0 0 3px #000; }
  #controls { position:fixed; left:10px; top:10px; display:flex; gap:6px; }
  button { padding:6px 10px; background:rgba(38,48,58,.85); color:var(--fg); border:1px solid #3d4955; border-radius:5px; cursor:pointer; font:inherit; }
  button.on { background:#3d5a80; border-color:#6b8fbf; }
  #status { position:fixed; left:10px; bottom:10px; color:#fff; text-shadow:0 0 3px #000; }
  @media (max-width: 640px) { #panel { left:10px; right:10px; width:auto; top:auto; bottom:10px; max-height:45%; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.13.0/babylon.js"></script>
</head>
<body>
<canvas id="view"></canvas>
<div id="controls">
  <button id="first" class="on">Bot's eyes</button>
  <button id="third">Orbit</button>
</div>
<div id="status">connecting…</div>
<div id="panel">
  <div class="head"><b id="who">…</b><span class="mono" id="dim"></span></div>
  <div class="mono" id="pos"></div>
  <div class="bars"><div class="bar" title="health"><i id="hp" style="background:#e55"></i></div>
                    <div class="bar" title="food"><i id="food" style="background:#c8913a"></i></div></div>
  <div class="mono" id="hf"></div>
  <h2>Thinking</h2><div id="stack"></div>
  <h2>Chain</h2><div id="chain" class="flow"></div>
  <h2>Interrupts</h2><div id="intr" class="flow"></div>
  <h2>Hotbar</h2><div id="hotbar" class="hot9"></div>
  <h2>Near</h2><div id="near" class="mono"></div>
</div>
<script type="module">
import * as R from "/web/viewer.js";
const B = globalThis.BABYLON;
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- the renderer, as steve's embed sets it up
const canvas = $("view");
const viewer = R.createViewer(canvas, { workerUrl: "/web/worker.js", textureUrl: "/tex/entity/player/wide/steve.png" });
const fit = () => { const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; R.resizeViewer(viewer, w, h); } };
new ResizeObserver(fit).observe(canvas); fit();
globalThis.viewer = viewer; // for the console

const toMap = (o) => new Map(Object.entries(o));
async function applyAssets(a) {
  const images = new Map();
  await Promise.all(a.textureNames.map((n) => fetch(`data:image/png;base64,${a.textureData[n]}`).then((r) => r.blob())
    .then(createImageBitmap).then((bmp) => images.set(n, bmp)).catch(() => {})));
  const atlas = R.createTextureAtlas(a.textureNames.filter((n) => images.has(n)), (n) => images.get(n.replace(".png", "")));
  const states = R.prepareBlockStates(a.blockStates, a.blockModels, atlas.uvMap);
  for (const w of viewer.worldRenderer.workers) w.postMessage({ type: "registryData", blocks: a.blocks, biomes: a.biomes });
  const t = a.tints;
  R.setViewerAssets(viewer, atlas, states, { grass: toMap(t.grass), foliage: toMap(t.foliage), water: toMap(t.water),
    redstone: toMap(t.redstone), constant: toMap(t.constant), grassDefault: t.grassDefault, foliageDefault: t.foliageDefault, waterDefault: t.waterDefault });
  R.setEntityModels(a.entityModels || {});
}

// ---------------------------------------------------------------- columns: fetched again when their version moves
const versions = new Map(), inflight = new Set();
const FETCHES = 4; // columns in flight at once, nearest first, so the ground under the bot draws before the horizon
function syncColumns(cols, pos, radius) {
  const [px, pz] = [Math.floor(pos[0]) >> 4, Math.floor(pos[2]) >> 4];
  const wanted = Object.entries(cols).filter(([key, v]) => versions.get(key) !== v && !inflight.has(key))
    .map(([key, v]) => { const [x, z] = key.split(",").map(Number); return [Math.hypot(x - px, z - pz), key, v]; })
    .sort((a, b) => a[0] - b[0]).slice(0, Math.max(0, FETCHES - inflight.size));
  for (const [, key, v] of wanted) {
    inflight.add(key);
    const [x, z] = key.split(",");
    fetch(`/column?x=${x}&z=${z}`).then((r) => r.json()).then((c) => {
      if (!c.buf) return;
      const col = R.createChunkColumn({ minY: c.minY, worldHeight: c.height, maxBitsPerBlock: R.GLOBAL_BITS_PER_BLOCK, maxBitsPerBiome: R.GLOBAL_BITS_PER_BIOME });
      R.loadChunkColumn(col, R.fromBase64(c.buf), true);
      R.addViewerColumn(viewer, c.x, c.z, col, c.minY, c.height);
      versions.set(key, v);
    }).finally(() => inflight.delete(key));
  }
  const [bx, bz] = [Math.floor(pos[0]) >> 4, Math.floor(pos[2]) >> 4];
  for (const key of [...versions.keys()]) {
    const [cx, cz] = key.split(",").map(Number);
    if (!(key in cols) && Math.max(Math.abs(cx - bx), Math.abs(cz - bz)) > radius + 2) { R.removeViewerColumn(viewer, cx, cz); versions.delete(key); }
  }
}

// ---------------------------------------------------------------- entities: the bot itself in orbit, the rest always
const rad = (d) => d * Math.PI / 180;
const yawOf = (deg) => Math.PI - rad(deg);        // the game's degrees → typecraft's radians (fromNotchianYaw)
const pitchOf = (deg) => -rad(deg);
const BOT = -1;
const ents = new Map(); // id → {target, cur, name}
function syncEntities(list, f) {
  const want = new Map(list.map((e) => [e.id, { name: e.kind === "item" ? "item" : e.kind || "unknown", x: e.pos[0], y: e.pos[1], z: e.pos[2], yaw: yawOf(e.yaw || 0) }]));
  if (mode === "third" && f.pos) want.set(BOT, { name: "player", user: f.name, x: f.pos[0], y: f.pos[1], z: f.pos[2], yaw: yawOf(f.look ? f.look[0] : 0) });
  for (const [id, e] of want) {
    const have = ents.get(id);
    if (!have || have.name !== e.name) {
      if (have) R.removeViewerEntity(viewer, id);
      R.addViewerEntity(viewer, id, e.name, e.user || null, e.x, e.y, e.z, e.yaw);
      ents.set(id, { name: e.name, target: e, cur: { ...e } });
    } else have.target = e;
  }
  for (const id of [...ents.keys()]) if (!want.has(id)) { R.removeViewerEntity(viewer, id); ents.delete(id); }
}

// ---------------------------------------------------------------- the intent's target cells, outlined
const outline = (r, g, b) => { const m = B.MeshBuilder.CreateBox("target", { size: 1.02 }, viewer.scene);
  const mat = new B.StandardMaterial("target", viewer.scene); mat.wireframe = true; mat.emissiveColor = new B.Color3(r, g, b); mat.disableLighting = true;
  m.material = mat; m.isPickable = false; m.setEnabled(false); return m; };
const targets = [outline(0.42, 0.72, 1), outline(0.55, 0.85, 0.55), outline(0.55, 0.85, 0.55)];
function placeTargets(f) {
  const ts = [];
  for (let i = f.intent; i; i = i["intent/child"]) for (const k of ["intent/target", "intent/cell"]) {
    const t = i[k]; if (Array.isArray(t) && t.length === 3 && t.every(Number.isInteger)) ts.push(t);
  }
  targets.forEach((m, k) => { m.setEnabled(!!ts[k]); if (ts[k]) m.position.set(ts[k][0] + 0.5, ts[k][1] + 0.5, ts[k][2] + 0.5); });
}

// ---------------------------------------------------------------- cameras: the bot's eyes, or an orbit round it (drag, wheel)
let mode = "first";
const orbit = { theta: -0.8, phi: 0.9, dist: 9 };
// ?mode=third&theta=&phi=&dist= opens on a given camera, so two screenshots can be taken from the same one
const q = new URLSearchParams(location.search);
for (const k of ["theta", "phi", "dist"]) if (q.has(k)) orbit[k] = Number(q.get(k));
const setMode = (m) => { mode = m; $("first").classList.toggle("on", m === "first"); $("third").classList.toggle("on", m === "third"); };
$("first").onclick = () => setMode("first");
$("third").onclick = () => setMode("third");
if (q.get("mode") === "third") setMode("third");
let drag = null;
canvas.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; if (mode === "first") setMode("third"); });
addEventListener("pointerup", () => { drag = null; });
addEventListener("pointermove", (e) => { if (!drag) return;
  orbit.theta -= (e.clientX - drag[0]) * 0.008; orbit.phi = Math.min(1.5, Math.max(0.1, orbit.phi - (e.clientY - drag[1]) * 0.008)); drag = [e.clientX, e.clientY]; });
canvas.addEventListener("wheel", (e) => { e.preventDefault(); orbit.dist = Math.min(60, Math.max(2, orbit.dist * (1 + e.deltaY * 0.001))); }, { passive: false });

let pose = null, cur = null;
const lerpAngle = (a, b, t) => a + ((((b - a) % (2 * Math.PI)) + 3 * Math.PI) % (2 * Math.PI) - Math.PI) * t;
function aim(t) {
  if (!pose) return;
  if (!cur || Math.hypot(pose.x - cur.x, pose.y - cur.y, pose.z - cur.z) > 24) cur = { ...pose };
  for (const k of ["x", "y", "z", "pitch"]) cur[k] += (pose[k] - cur[k]) * t;
  cur.yaw = lerpAngle(cur.yaw, pose.yaw, t);
  if (mode === "first") { R.setViewerCamera(viewer, R.vec3(cur.x, cur.y, cur.z), cur.yaw, cur.pitch); return; }
  // the eye on a sphere round the bot's chest, turned to it the way the renderer turns its camera
  // (typecraft's yaw: 0 looks north, -z; pitch up is positive)
  const dx = -orbit.dist * Math.sin(orbit.phi) * Math.cos(orbit.theta), dy = -orbit.dist * Math.cos(orbit.phi), dz = -orbit.dist * Math.sin(orbit.phi) * Math.sin(orbit.theta);
  const eye = [cur.x + 0 - dx, cur.y + 1.2 - dy, cur.z - dz];
  R.setViewerCamera(viewer, R.vec3(eye[0], eye[1] - 1.6, eye[2]), Math.atan2(-dx, -dz), Math.atan2(dy, Math.hypot(dx, dz)));
}

// ---------------------------------------------------------------- the panel
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { walk: "walking to", dig: "digging", collect: "picking up", craft: "crafting", place: "placing", "open-container": "opening",
  "stairs-down": "staircase down", "stairs-up": "staircase up", fight: "fighting", smelt: "smelting", mine: "mining", "tunnel-to": "tunnelling to",
  eat: "eating", pillar: "pillaring up", scoop: "scooping", "back-off": "backing off", build: "building", "swim-out": "swimming out", flee: "fleeing" };
const say = (i) => [KIND[i["intent/kind"]] || i["intent/kind"], i["intent/target"] && JSON.stringify(i["intent/target"]),
  i["intent/item"], i["intent/recipe"], i["intent/build"], i["intent/for"] && "for " + i["intent/for"]].filter(Boolean).map(esc).join(" ");
let meta = { chain: [], always: [], radius: 3 }, icons = {};
function panel(f) {
  $("who").textContent = f.name || "bot";
  $("dim").textContent = (f.dimension || "minecraft:overworld").replace("minecraft:", "");
  $("pos").textContent = f.pos ? f.pos.map((v) => v.toFixed(1)).join("  ") + (f.look ? `   yaw ${f.look[0].toFixed(0)} pitch ${f.look[1].toFixed(0)}` : "") : "";
  $("hp").style.width = ((f.health ?? 0) / 20 * 100) + "%";
  $("food").style.width = ((f.food ?? 0) / 20 * 100) + "%";
  $("hf").textContent = `health ${f.health ?? "?"}  food ${f.food ?? "?"}${f.air != null && f.air < 300 ? "  air " + f.air : ""}  tick ${f.tick ?? ""}`;
  const always = new Set(meta.always.map((r) => r.id)), docs = Object.fromEntries([...meta.chain, ...meta.always].map((r) => [r.id, r.doc]));
  const i = f.intent, g = i && i["intent/goal"], isI = always.has(g);
  let s = "";
  if (g) s += `<div class="lvl ${isI ? "intr" : "goal"}">${isI ? "INTERRUPT" : "GOAL"}: ${esc(g)}<small>${esc(docs[g] || "")}</small></div>`;
  if (i) s += `<div class="lvl act">${say(i)}<small>intent #${i["intent/id"] ?? "?"}${i["intent/stage"] ? " · " + esc(i["intent/stage"]) : ""}${i["intent/op"] ? " · op " + esc(JSON.stringify(i["intent/op"])) : ""}</small></div>`;
  for (let c = i && i["intent/child"]; c; c = c["intent/child"])
    s += `<div class="lvl sub">${say(c)}<small>${esc(c["intent/stage"] || "sub-step")}</small></div>`;
  if (f.wait || f.waiting) s += `<div class="lvl wait">waiting: ${esc(JSON.stringify(f.wait || f.waiting))}</div>`;
  if (f.failed) s += `<div class="lvl intr">last failed: ${say(f.failed)}<small>${esc(f.failed["intent/reason"] || "")}</small></div>`;
  if (!i && !f.wait && !f.waiting) s += `<div class="lvl">idle · ${esc(f.status || "no plan")}</div>`;
  $("stack").innerHTML = s;
  const reached = new Set(f.reached || []), next = meta.chain.find((r) => !reached.has(r.id));
  $("chain").innerHTML = meta.chain.map((r) => `<span class="node${reached.has(r.id) ? " done" : ""}${r.id === g || (isI && next && r.id === next.id) ? " cur" : ""}" title="${esc(r.doc || "")}">${esc(r.id)}</span>`).join("");
  $("intr").innerHTML = meta.always.map((r) => `<span class="node${r.id === g ? " hot" : ""}" title="${esc(r.doc || "")}">${esc(r.id)}</span>`).join("");
  $("hotbar").innerHTML = (f.hotbar || Array(9).fill(null)).map((it, k) => {
    const t = it && icons[it.item];
    const src = !t ? "" : t.startsWith("item/") ? `/tex/${t}.png` : `data:image/png;base64,${assets.textureData[t.replace("block/", "")] || ""}`;
    return `<div class="slot${k === f.held ? " sel" : ""}" title="${it ? esc(it.item) : ""}">${it ? (src ? `<img src="${src}">` : `<small>${esc(it.item)}</small>`) + `<span>${it.count > 1 ? it.count : ""}</span>` : ""}</div>`;
  }).join("");
  const p = f.pos || [0, 0, 0];
  $("near").innerHTML = (f.entities || []).map((e) => [Math.hypot(e.pos[0] - p[0], e.pos[1] - p[1], e.pos[2] - p[2]), e])
    .sort((a, b) => a[0] - b[0]).slice(0, 8)
    .map(([d, e]) => `<div${e.hostile ? ' style="color:#ff8a7a"' : ""}>${esc(e.kind === "item" ? e.item || "item" : e.kind)} ${d.toFixed(1)}m${e.health != null ? " ♥" + e.health : ""}</div>`).join("") || "nothing";
}

// ---------------------------------------------------------------- sky and fog: the biome underfoot's sky colour, fog to the edge of what is loaded
let skyName = null;
function sky(f) {
  const name = f.biome != null && assets.biomes[f.biome] ? assets.biomes[f.biome].name : "plains";
  if (name === skyName) return;
  skyName = name;
  const c = (assets.skies || {})[name] || [0.47, 0.65, 1];
  const scene = viewer.scene;
  scene.clearColor = new B.Color4(c[0], c[1], c[2], 1);
  scene.fogMode = B.Scene.FOGMODE_LINEAR;
  scene.fogColor = new B.Color3(c[0], c[1], c[2]);
  scene.fogStart = meta.radius * 16 * 0.55;
  scene.fogEnd = meta.radius * 16;
}

// ---------------------------------------------------------------- polling and the render loop
async function poll() {
  try {
    const f = await (await fetch("/frame")).json();
    if (f.pos) {
      pose = { x: f.pos[0], y: f.pos[1], z: f.pos[2], yaw: yawOf(f.look ? f.look[0] : 0), pitch: pitchOf(f.look ? f.look[1] : 0) };
      panel(f); sky(f); placeTargets(f); syncEntities(f.entities || [], f); syncColumns(f.columns || {}, f.pos, meta.radius);
      $("status").textContent = `${versions.size} columns`;
    } else $("status").textContent = "waiting for the bot to spawn…";
  } catch (e) { $("status").textContent = "bot not answering (" + e.message + ")"; }
  setTimeout(poll, 100);
}
let last = performance.now();
function loop() {
  const now = performance.now(), t = Math.min(1, (now - last) / 90); last = now;
  try {
    aim(t);
    for (const [id, e] of ents) {
      const c = e.cur, g = e.target;
      c.x += (g.x - c.x) * t; c.y += (g.y - c.y) * t; c.z += (g.z - c.z) * t; c.yaw = lerpAngle(c.yaw, g.yaw, t);
      R.updateViewerEntity(viewer, id, c.x, c.y, c.z, c.yaw);
    }
    R.renderViewer(viewer);
  } catch (_) { /* an entity mesh hiccup must not stop the loop */ }
  requestAnimationFrame(loop);
}

$("status").textContent = "loading the game's assets…";
const assets = await (await fetch("/assets.json", { cache: "no-cache" })).json();
await applyAssets(assets);
meta = await (await fetch("/meta")).json();
icons = await (await fetch("/icons")).json();
poll(); loop();
</script>
</body>
</html>
